services:
  admin-gudang-dev:
    image: node:22-alpine
    container_name: admin-gudang-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - admin-gudang-dev-node-modules:/app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    stdin_open: true
    tty: true
    networks:
      - admin-gudang-network

volumes:
  admin-gudang-dev-node-modules:
    driver: local

networks:
  admin-gudang-network:
    driver: bridge
