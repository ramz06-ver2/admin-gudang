<style>
  /* Scrollbar halus */
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  /* Animasi row */
  tbody tr { transition: background 0.15s; }
  
  /* Mobile card hide/show */
  @media (max-width: 767px) {
    .desktop-table { display: none; }
  }
  @media (min-width: 768px) {
    .mobile-cards { display: none; }
  }
  
  /* Sort indicator */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #f1f5f9; }
  .sort-asc::after { content: " ▲"; font-size: 10px; color: #1677ff; }

        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

        </svg>
        <input

          class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
        />
      </div>

      <!-- Filter Kategori -->
      <select id="filterKategori" class="px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30">
        <option value="">Semua Kategori</option>
        <option value="Material">Material</option>
        <option value="Alat Bantu">Alat Bantu</option>
      </select>

      <!-- Filter Stok -->
      <select id="filterStok" class="px-3 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30">
        <option value="">Semua Stok</option>
        <option value="out">Habis (0)</option>
        <option value="low">Menipis (≤ 5)</option>
        <option value="safe">Aman (&gt; 5)</option>
      </select>

      <!-- Export -->
      <button id="btnExport" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
        </svg>
        Export CSV
      </button>
    </div>

    <!-- Info hasil -->
    <div class="mt-3 text-xs text-slate-500">
      Menampilkan <span id="countShown" class="font-semibold text-slate-700">0</span> dari
      <span id="countTotal" class="font-semibold text-slate-700">0</span> item
    </div>
  </div>

  <!-- DESKTOP TABLE -->
  <div class="desktop-table bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="text-left px-4 py-3 font-semibold text-slate-600 w-16">#</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600 sortable" data-sort="kode">Kode</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600 sortable" data-sort="nama">Nama Barang</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Ukuran</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Kategori</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600 sortable" data-sort="stok">Stok</th>
            <th class="text-center px-4 py-3 font-semibold text-slate-600">Status</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <!-- MOBILE CARDS -->
  <div class="mobile-cards space-y-3" id="mobileCards"></div>

  <!-- EMPTY STATE -->
  <div id="emptyState" class="hidden text-center py-16 text-slate-400">

    </svg>
    <p class="text-sm">Tidak ada item yang cocok dengan filter</p>
  </div>

</div>

// ============================================================
// STATE
// ============================================================
let state = {
  search: "",
  kategori: "",
  stokFilter: "",
  sortKey: null,
  sortDir: "asc",
};

// ============================================================
// HELPERS
// ============================================================
const getStatus = (stok) => {
  if (stok === 0) return "out";
  if (stok <= 5) return "low";
  return "safe";
};

const STATUS_BADGE = {
  out:  { label: "Habis",   cls: "bg-red-50 text-red-600 border-red-200" },
  low:  { label: "Menipis", cls: "bg-amber-50 text-amber-700 border-amber-200" },
  safe: { label: "Aman",    cls: "bg-emerald-50 text-emerald-700 border-emerald-200" },
};

const formatNumber = (n) => new Intl.NumberFormat("id-ID").format(n);

const escapeHtml = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
  );

// ============================================================
// FILTER + SORT
// ============================================================
const getFilteredData = () => {
  let list = [...DATA];

  // Search
  if (state.search.trim()) {
    const q = state.search.toLowerCase();
    list = list.filter((it) =>
      (it.nama || "").toLowerCase().includes(q) ||
      (it.kode || "").toLowerCase().includes(q) ||
      (it.ukuran || "").toLowerCase().includes(q)
    );
  }

  // Kategori
  if (state.kategori) {
    list = list.filter((it) => it.kategori === state.kategori);
  }

  // Stok
  if (state.stokFilter) {
    list = list.filter((it) => getStatus(it.stok) === state.stokFilter);
  }

  // Sort
  if (state.sortKey) {
    const key = state.sortKey;
    const dir = state.sortDir === "asc" ? 1 : -1;
    list.sort((a, b) => {
      let va = a[key], vb = b[key];
      if (typeof va === "string") va = va.toLowerCase();
      if (typeof vb === "string") vb = vb.toLowerCase();
      if (va == null) return 1;
      if (vb == null) return -1;
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
  }

  return list;
};

// ============================================================
// RENDER: TABLE (DESKTOP)
// ============================================================
const renderTable = (list) => {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = list.map((it, i) => {
    const st = getStatus(it.stok);
    const badge = STATUS_BADGE[st];
    return `
      <tr class="hover:bg-slate-50/70">
        <td class="px-4 py-3 text-slate-400 text-xs">${i + 1}</td>
        <td class="px-4 py-3">
          <span class="font-mono text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">${escapeHtml(it.kode)}</span>
        </td>
        <td class="px-4 py-3">
          <div class="font-medium text-slate-800">${escapeHtml(it.nama)}</div>
        </td>
        <td class="px-4 py-3 text-slate-600">${it.ukuran ? escapeHtml(it.ukuran) : '<span class="text-slate-300">-</span>'}</td>
        <td class="px-4 py-3">
          <span class="text-xs ${it.kategori === 'Material' ? 'bg-indigo-50 text-indigo-700' : 'bg-amber-50 text-amber-700'} px-2 py-1 rounded font-medium">
            ${escapeHtml(it.kategori)}
          </span>
        </td>
        <td class="px-4 py-3 text-right">
          <span class="font-semibold text-slate-800">${formatNumber(it.stok)}</span>
          <span class="text-xs text-slate-500 ml-1">${escapeHtml(it.satuan)}</span>
        </td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block text-xs border px-2 py-1 rounded-full font-medium ${badge.cls}">
            ${badge.label}
          </span>
        </td>
      </tr>
    `;
  }).join("");
};

// ============================================================
// RENDER: CARDS (MOBILE)
// ============================================================
const renderCards = (list) => {
  const container = document.getElementById("mobileCards");
  container.innerHTML = list.map((it) => {
    const st = getStatus(it.stok);
    const badge = STATUS_BADGE[st];
    return `
      <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
        <div class="flex justify-between items-start gap-3 mb-2">
          <div class="min-w-0 flex-1">
            <div class="font-semibold text-slate-800 truncate">${escapeHtml(it.nama)}</div>
            <div class="text-xs text-slate-500 mt-0.5">
              <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded">${escapeHtml(it.kode)}</span>
            </div>
          </div>
          <span class="text-xs border px-2 py-1 rounded-full font-medium whitespace-nowrap ${badge.cls}">
            ${badge.label}
          </span>
        </div>
        
        ${it.ukuran ? `
          <div class="text-xs text-slate-600 mb-2">
            <span class="text-slate-400">Ukuran:</span> ${escapeHtml(it.ukuran)}
          </div>
        ` : ""}
        
        <div class="flex justify-between items-center pt-2 border-t border-slate-100">
          <span class="text-xs ${it.kategori === 'Material' ? 'bg-indigo-50 text-indigo-700' : 'bg-amber-50 text-amber-700'} px-2 py-1 rounded font-medium">
            ${escapeHtml(it.kategori)}
          </span>
          <span class="text-sm">
            <span class="font-bold text-slate-800">${formatNumber(it.stok)}</span>
            <span class="text-xs text-slate-500 ml-1">${escapeHtml(it.satuan)}</span>
          </span>
        </div>
      </div>
    `;
  }).join("");
};

// ============================================================
// RENDER: SEMUA
// ============================================================
const renderAll = () => {
  const list = getFilteredData();

  // Empty state
  const empty = document.getElementById("emptyState");
  const tableWrap = document.querySelector(".desktop-table");
  const cardWrap = document.querySelector(".mobile-cards");

  if (list.length === 0) {
    empty.classList.remove("hidden");
    tableWrap.classList.add("hidden");
    cardWrap.classList.add("hidden");
  } else {
    empty.classList.add("hidden");
    tableWrap.classList.remove("hidden");
    cardWrap.classList.remove("hidden");
    renderTable(list);
    renderCards(list);
  }

  // Counter
  document.getElementById("countShown").textContent = list.length;
  document.getElementById("countTotal").textContent = DATA.length;
};

// ============================================================
// STATS
// ============================================================
const renderStats = () => {
  const total = DATA.length;
  const totalStock = DATA.reduce((s, it) => s + (it.stok || 0), 0);
  const material = DATA.filter((it) => it.kategori === "Material").length;
  const alat = DATA.filter((it) => it.kategori === "Alat Bantu").length;

  document.getElementById("statTotal").textContent = formatNumber(total);
  document.getElementById("statStock").textContent = formatNumber(totalStock);
  document.getElementById("statMaterial").textContent = formatNumber(material);
  document.getElementById("statAlat").textContent = formatNumber(alat);

  document.getElementById("subtitle").textContent =
    `${total} item terdaftar · ${material} material · ${alat} alat bantu`;
};

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderAll();
});

document.getElementById("filterKategori").addEventListener("change", (e) => {
  state.kategori = e.target.value;
  renderAll();
});

document.getElementById("filterStok").addEventListener("change", (e) => {
  state.stokFilter = e.target.value;
  renderAll();
});

// Sort klik header
document.querySelectorAll("th.sortable").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    } else {
      state.sortKey = key;
      state.sortDir = "asc";
    }

    // Update visual
    document.querySelectorAll("th.sortable").forEach((t) => {
      t.classList.remove("sort-asc", "sort-desc");
    });
    th.classList.add(state.sortDir === "asc" ? "sort-asc" : "sort-desc");

    renderAll();
  });
});

// Export CSV
document.getElementById("btnExport").addEventListener("click", () => {
  const list = getFilteredData();
  const headers = ["No", "Kode", "Nama", "Ukuran", "Kategori", "Stok", "Satuan", "Status"];
  const rows = list.map((it, i) => [
    i + 1,
    it.kode,
    it.nama,
    it.ukuran || "",
    it.kategori,
    it.stok,
    it.satuan,
    STATUS_BADGE[getStatus(it.stok)].label,
  ]);

  const csvContent = [headers, ...rows]
    .map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `produk-tersedia-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// ============================================================
// INIT
// ============================================================
renderStats();
renderAll();
</script>

</body>
</html>
